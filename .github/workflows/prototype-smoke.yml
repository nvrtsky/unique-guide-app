name: Prototype smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, prototype/mobile-crm-2026-08-03]

jobs:
  smoke:
    name: Prototype smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check mobile-leads.js
      - run: node --check tour-operations.js
      - run: node --check prototype-smoke-test.js
      - run: node --check prototype-viewport-test.js
      - run: node --check capture-prototype-screenshots.js
      - run: sh -n build-mobile-spec.sh
      - run: node prototype-smoke-test.js
      - run: node prototype-viewport-test.js
      - name: Verify isolated mock adapter
        run: |
          if grep -En 'fetch[[:space:]]*\(|new[[:space:]]+XMLHttpRequest|new[[:space:]]+WebSocket|new[[:space:]]+EventSource|sendBeacon[[:space:]]*\(|/api/' mobile-leads.js tour-operations.js; then
            echo "The prototype must not call an API"
            exit 1
          fi
      - name: Verify standalone pages
        run: |
          test -f mobile-leads.html
          test -f mobile-leads-tz.html
          test -s mobile-leads-tz.css
          test -s mobile-leads-tz.md
          test -s assets/spec/01-lead-to-summary.png
          test -s assets/spec/02-tour-summary.png
          test -s assets/spec/03-tour-coverage.png
          test -s assets/spec/04-tourist-group-selection.png
          test -s assets/spec/05-conflict-review.png
          test -s assets/spec/06-tourist-logistics.png
          test -s assets/spec/07-city-directory.png
          test -s assets/spec/08-split-operation.png
          test -s assets/spec/09-guide-readonly.png
          test -s assets/spec/10-work-status.png
          test -s assets/spec/11-offline.png
          test -s assets/spec/12-point-picker.png
          test -s assets/spec/13-error-state.png
          test -s assets/spec/14-empty-state.png
          test -s assets/spec/15-summary-375.png
          test -s assets/spec/16-lead-final.png
          test -s assets/spec/17-tour-final.png
          test -s assets/spec/18-tourist-profile-final.png
          test -s assets/spec/19-tourist-tour-final.png
          test -s assets/spec/20-summary-final.png
          test -s assets/spec/21-team-final.png
          test -s assets/spec/22-statuses-final.png
          test -s mobile-leads-tz-template.html
          test -s build-mobile-spec.sh
          test -s capture-prototype-screenshots.js
          test -s prototype-viewport-test.js
          test -f index.html
          test -s tour-operations.html
          test -s tour-operations.css
          test -s tour-operations.js
